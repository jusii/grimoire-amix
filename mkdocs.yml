site_name: grimoire-amix
site_description: >-
  Developer- and LLM-oriented documentation for Amiga Unix (Amix) — Commodore's
  port of AT&T System V Release 4 (SVR4) to 68030 Amigas.
docs_dir: docs
site_url: https://jusii.github.io/grimoire-amix/
repo_url: https://github.com/Jusii/grimoire-amix
repo_name: Jusii/grimoire-amix

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - How Amix works:
      - Overview: how-it-works/overview.md
      - Hardware & requirements: how-it-works/hardware.md
      - The RAM ceiling: how-it-works/ram-ceiling.md
      - 68040/68060 status: how-it-works/68040-68060-status.md
      - Boot process: how-it-works/boot-process.md
      - Kernel architecture: how-it-works/kernel-architecture.md
      - Filesystems & disks: how-it-works/filesystems-and-disks.md
      - Networking: how-it-works/networking.md
      - X11 & desktop: how-it-works/x11-and-desktop.md
      - Package management: how-it-works/package-management.md
      - Package repository: how-it-works/package-repository.md
      - Quirks: how-it-works/quirks.md
      - Emulation fidelity: how-it-works/emulation-fidelity.md
      - Performance benchmarks: how-it-works/performance-benchmarks.md
      - Glossary: how-it-works/glossary.md
  - Getting started:
      - Amix on WinUAE: getting-started/emulation-winuae.md
      - Amix on FS-UAE: getting-started/emulation-fs-uae.md
      - Amix on Amiberry: getting-started/emulation-amiberry.md
      - Putting Amix on your LAN: getting-started/networking-on-the-lan.md
      - Install walkthrough: getting-started/install-walkthrough.md
